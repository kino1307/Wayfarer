services:
  server:
    build: ./server
    ports:
      - "3013:3013" # published for direct API access/debugging; the client reaches it via nginx
    environment:
      PORT: 3013
      # Compose auto-loads a .env next to this file for ${...} substitution. Default assumes
      # local (docker compose up on localhost:8080); a deploy's own .env overrides this to its
      # real public origin (e.g. https://wayfarer.wjleece.dev) without editing this committed file.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3013/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
