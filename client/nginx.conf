server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin reverse proxy to the API container — mirrors the Vite dev proxy so the
    # client never needs a baked-in API base URL. "server" is the docker-compose service name.
    location /api/ {
        proxy_pass http://server:3013/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The agent-loop queries routinely run 60-300s+, and /api/structured/stream is a
        # long-lived NDJSON response — buffering would delay/break progress events and a
        # short timeout would kill a slow-but-legitimate query mid-flight.
        proxy_buffering off;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }
}
